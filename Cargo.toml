[package]
name = "mario_app"
version = "0.1.0"
edition = "2021"
description = "A colorful 2D platformer built with Rust and Macroquad"
license = "MIT"

[dependencies]
macroquad = "0.4.14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[package.metadata.android]
package_name = "com.smailmelki.marioapp"
label = "MarioApp"
version_code = 1
version_name = "0.1.0"
android_version = 29
target_sdk_version = 29
min_sdk_version = 23
build_targets = ["aarch64-linux-android"]

[package.metadata.android.activity_attributes]
"android:exported" = "true"
"android:screenOrientation" = "userLandscape"
