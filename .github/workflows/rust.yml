name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check
      - name: Build release
        run: cargo build --release

  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build APK with Macroquad toolchain
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/root/src" \
            -w /root/src \
            notfl3/cargo-apk bash -lc 'set -e; mkdir -p ~/.android; touch ~/.android/repositories.cfg; yes | /opt/android-sdk-linux/cmdline-tools/latest/bin/sdkmanager --sdk_root=/opt/android-sdk-linux "platforms;android-36" "build-tools;36.0.0-rc5"; test -f /opt/android-sdk-linux/platforms/android-36/android.jar; cargo quad-apk build --release'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MarioApp-Android-APK
          path: target/android-artifacts/release/apk/*.apk
          if-no-files-found: error
          retention-days: 14
